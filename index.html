<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BENTEN WARS｜上山市弁天二丁目の野望</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#081321;--panel:#182b40;--gold:#f4c777;
  --text:#f5f1e8;--muted:#adc1d0;--red:#c65361;
}
*{box-sizing:border-box}
body{margin:0;background:#050b12;color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:700px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header{padding:9px 12px;background:linear-gradient(100deg,#0b1929,#28384c);display:flex;justify-content:space-between;align-items:center}
.logo{font-size:10px;color:var(--gold);letter-spacing:2px}
.logo strong{display:block;font-size:16px;color:white;letter-spacing:0}
#chapter{text-align:right;font-size:11px;color:var(--gold)}
#date{text-align:right;font-size:10px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px 7px}
.stat{background:#20374d;border-radius:6px;text-align:center;padding:5px 1px;font-size:10px;color:var(--muted)}
.stat b{display:block;font-size:15px;color:var(--gold)}
#mapbox{flex:1;min-height:120px;margin:0 7px;position:relative;border:1px solid #60788a;border-radius:9px;overflow:hidden}
#map{height:100%;width:100%}
.maplabel{position:absolute;top:8px;left:8px;z-index:500;background:#091725e8;padding:7px;border-radius:5px;font-size:10px;pointer-events:none}
.maplabel b{display:block;color:var(--gold);font-size:12px}
.pin{width:27px;height:27px;background:var(--red);border:2px solid #ffe7bb;border-radius:50%;display:grid;place-items:center;color:white;font-weight:bold}
.pin.owned{background:#258b6e}
.pin.selected{outline:3px solid var(--gold);outline-offset:2px}
#target{margin:5px 7px 0;padding:8px;background:var(--panel);border-radius:7px;display:flex;justify-content:space-between;gap:8px;font-size:11px}
#target b{color:var(--gold);font-size:13px}
#target small{display:block;color:var(--muted)}
#hero{display:flex;align-items:center;gap:9px;padding:5px 9px}
#portrait{width:62px;height:64px;flex-shrink:0}
#portrait svg{width:100%;height:100%}
#speech{flex:1;font-size:11px;line-height:1.5}
#speech b{display:block;color:var(--gold);font-size:13px}
#party{background:#29465c;border:1px solid #728c9f;border-radius:6px;padding:8px;font-size:11px}
#log{margin:0 7px 5px;padding:7px;background:#233d53;border-left:3px solid var(--gold);font-size:11px;min-height:34px}
#speed{display:flex;align-items:center;gap:4px;padding:0 7px 5px}
#speed span{font-size:10px;color:var(--muted)}
#speed button{flex:1;background:#213b51;border:1px solid #647e91;border-radius:5px;padding:6px 0;font-size:11px}
#speed button.active{background:var(--gold);color:#132338;font-weight:bold}
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 7px max(9px,env(safe-area-inset-bottom))}
#actions button{background:#29475e;border:1px solid #68879b;border-radius:8px;padding:7px 2px;min-height:45px;font-size:12px}
#actions button.main{background:linear-gradient(#f6cd86,#bd864a);color:#172538;font-weight:bold}
#actions small{display:block;font-size:9px;opacity:.8}
#overlay{position:fixed;inset:0;background:#030a13ed;z-index:3000;display:none;align-items:center;justify-content:center;padding:14px}
#overlay.show{display:flex}
#dialog{width:min(460px,100%);max-height:90dvh;overflow:auto;background:linear-gradient(145deg,#223d55,#112236);border:1px solid var(--gold);border-radius:13px;padding:17px}
#dialog h2{margin:0 0 9px;color:var(--gold);font-size:19px}
#dialog p{white-space:pre-line;line-height:1.75;font-size:12px}
#dialogArt{display:flex;justify-content:center}
#dialogArt svg{width:145px;height:145px;max-height:24dvh}
.choice{width:100%;display:block;text-align:left;background:#2b4b62;border:1px solid #68879b;border-radius:8px;padding:10px;margin-top:7px;font-size:12px}
.choice b{display:block;color:#ffe2a4;font-size:13px}
.choice small{display:block;color:#c2d1dd;font-size:10px;margin-top:4px}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.roster button{background:#253e54;border:1px solid #668399;border-radius:7px;font-size:10px;padding:5px}
.roster button.on{border-color:var(--gold);background:#484733}
.roster svg{width:75px;height:75px;display:block;margin:auto}
@media(max-height:730px){
header{padding:5px 10px}
.stats{padding:3px 7px}
.stat{padding:2px}
.stat b{font-size:13px}
#hero{padding:2px 8px}
#portrait{width:46px;height:48px}
#actions button{min-height:38px;padding:4px 2px}
}
</style>
</head>
<body>

<div id="app">
<header>
<div class="logo">BENTEN WARS<strong>上山市弁天二丁目の野望</strong></div>
<div><div id="chapter"></div><div id="date"></div></div>
</header>

<div class="stats">
<div class="stat"><b id="cash"></b>現金</div>
<div class="stat"><b id="troops"></b>戦力</div>
<div class="stat"><b id="food"></b>食料</div>
<div class="stat"><b id="trust"></b>信用</div>
<div class="stat"><b id="network"></b>人脈</div>
<div class="stat"><b id="alert"></b>国家警戒</div>
<div class="stat"><b id="debt"></b>借金</div>
<div class="stat"><b id="land"></b>領土</div>
</div>

<div id="mapbox">
<div id="map"></div>
<div class="maplabel">
<b id="mapTitle"></b>
<span>実際の道路地図／攻略拠点はゲーム用</span>
</div>
</div>

<div id="target">
<div><b id="targetName">攻略先を選択</b><small id="targetDesc">地図のマーカーをタップ</small></div>
<div id="targetPower"></div>
</div>

<div id="hero">
<div id="portrait"></div>
<div id="speech"><b>弁天ザウルス</b>「町内会から天下を取る！」</div>
<button id="party">仲間・編成</button>
</div>

<div id="log">秘書官「まず生活費を確保してください。」</div>

<div id="speed">
<span>時間スキップ</span>
<button data-speed="1" class="active">×1</button>
<button data-speed="2">×2</button>
<button data-speed="5">×5</button>
<button data-speed="10">×10</button>
<button data-speed="20">×20</button>
</div>

<div id="actions">
<button class="main" id="war">⚔ 出陣<small>奇策と代償</small></button>
<button id="work">資金・調達<small>仕事と借金</small></button>
<button id="people">人脈づくり<small>怪人を探す</small></button>
<button id="manage">内政・徴兵<small>軍を維持する</small></button>
<button id="skip">⏩ 時間スキップ<small>指定日数を進める</small></button>
<button id="menu">記録・設定<small>自動保存</small></button>
</div>
</div>

<div id="overlay">
<div id="dialog">
<h2 id="dialogTitle"></h2>
<div id="dialogArt"></div>
<p id="dialogText"></p>
<div id="choices"></div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmt=n=>Math.round(n).toLocaleString("ja-JP");

const CAST={
dino:["弁天ザウルス","#55bb83","弁天大暴走","天下統一を夢見る緑の恐竜。"],
scare:["案山子将軍","#d6ac70","稲穂斬り","雨に弱い伝説の案山子武将。"],
clock:["いまはなんじ？おじさん","#b9a5dc","時刻崩壊","会うたびに「いまはなんじ？」と聞いてくる。"],
yamaya:["やまや！！おじさん","#e6a06b","やまや絶叫","突然「やまや！！」と叫ぶ。誰にも理由が分からない。"],
chief:["回覧板の鬼","#82b6c8","回覧板包囲","回覧板を返さない人間を絶対に許さない。"],
bath:["温泉の仙人","#8bc7b6","熱湯幻術","温泉から出ずに世界を動かす。"],
mayor:["決裁保留大臣","#bba4d0","無限稟議","書類で敵の戦意を奪う。"],
castle:["自称上山城主","#d6aa79","城壁転送","城の所有権については説明しない。"],
train:["終電を逃す男","#9bbad3","深夜強行軍","徒歩で県境を越える男。"],
potato:["芋煮奉行","#d8b47e","芋煮爆弾","味付けで戦争を始める。"],
chess:["将棋軍師","#b9a47b","王手飛車取り","すべての人間関係を将棋で説明する。"],
cherry:["さくらんぼ怪人","#d7808b","分身果実","常に二人いるように見える。"],
uesugi:["上杉の影武者","#89add2","義の鉄壁","本人は本物だと主張する。"],
mogami:["最上の亡霊","#c2a5d1","出羽結界","山形市を守る謎の亡霊。"],
fish:["庄内の魚人","#78b9b5","日本海召喚","陸上でも泳ごうとする。"],
snow:["雪かき大臣","#a8c9df","豪雪封鎖","夏でも除雪計画を立てる。"],
melon:["スイカ将軍","#81b987","巨大果実砲","スイカを兵器に変える。"],
noodle:["そば仙人","#cbb18d","無限そば","戦争よりそばの茹で時間が大事。"],
river:["最上川の船頭","#8db9d0","川下り奇襲","どこへでも船で行こうとする。"],
mountain:["山のマタギ","#a2ae88","山岳迷彩","人里に降りると迷子になる。"],
wine:["ワイン公爵","#bf89aa","祝宴催眠","戦争前から祝杯をあげる。"],
flower:["花粉の女王","#dba0bf","花粉暴風","味方もくしゃみで動けなくなる。"]
};

const YAMAGATA=[
["山形市",38.255,140.339,115,"mogami"],
["米沢市",37.922,140.117,105,"uesugi"],
["鶴岡市",38.727,139.827,93,"fish"],
["酒田市",38.914,139.836,93,"fish"],
["新庄市",38.765,140.301,78,"snow"],
["寒河江市",38.381,140.276,68,"cherry"],
["上山市",38.150,140.278,0,"dino"],
["村山市",38.484,140.381,65,"flower"],
["長井市",38.107,140.041,68,"flower"],
["天童市",38.362,140.378,85,"chess"],
["東根市",38.432,140.391,77,"cherry"],
["尾花沢市",38.601,140.405,70,"melon"],
["南陽市",38.055,140.148,72,"wine"],
["山辺町",38.290,140.264,51,"chief"],
["中山町",38.333,140.282,49,"potato"],
["河北町",38.427,140.315,55,"cherry"],
["西川町",38.425,140.148,63,"mountain"],
["朝日町",38.299,140.145,57,"flower"],
["大江町",38.380,140.205,53,"river"],
["大石田町",38.594,140.373,58,"noodle"],
["金山町",38.884,140.339,61,"mountain"],
["最上町",38.758,140.520,61,"bath"],
["舟形町",38.692,140.319,51,"fish"],
["真室川町",38.858,140.252,57,"snow"],
["大蔵村",38.704,140.230,57,"bath"],
["鮭川村",38.796,140.224,51,"fish"],
["戸沢村",38.738,140.140,54,"river"],
["高畠町",38.003,140.189,65,"wine"],
["川西町",38.004,140.045,59,"flower"],
["小国町",38.061,139.744,70,"mountain"],
["白鷹町",38.185,140.099,58,"flower"],
["飯豊町",38.046,139.989,63,"mountain"],
["三川町",38.796,139.850,54,"flower"],
["庄内町",38.849,139.905,64,"potato"],
["遊佐町",39.015,139.908,65,"mountain"]
].map((a,i)=>({
id:"y"+i,name:a[0],lat:a[1],lng:a[2],
power:a[3],person:a[4]
}));

const CHAPTERS=[
{
title:"第1章 弁天の乱",
map:"弁天二丁目周辺",
center:[38.17,140.28],zoom:15,
places:[
["b2","弁天二丁目",38.170,140.280,0,"dino"],
["b1","弁天一丁目勢力",38.174,140.278,18,"clock"],
["be","弁天東の自治会",38.172,140.286,24,"yamaya"],
["bs","弁天南の見回り隊",38.166,140.282,30,"chief"],
["bw","弁天西の連合",38.169,140.273,35,"scare"]
]
},
{
title:"第2章 上山市統一",
map:"上山市",
center:[38.15,140.28],zoom:12,
places:[
["home","弁天地区",38.170,140.280,0,"dino"],
["castle","上山城周辺",38.157,140.276,54,"castle"],
["station","かみのやま温泉駅周辺",38.152,140.278,44,"train"],
["hayama","葉山地区",38.144,140.262,51,"bath"],
["zao","蔵王坊平",38.126,140.395,68,"mountain"],
["narage","楢下宿周辺",38.112,140.245,48,"noodle"],
["mokichi","茂吉記念館周辺",38.174,140.298,53,"clock"],
["office","上山市役所周辺",38.150,140.269,78,"mayor"]
]
},
{
title:"第3章 出羽統一戦記",
map:"山形県35市町村",
center:[38.55,140.15],zoom:8,
places:YAMAGATA
}
];

CHAPTERS.slice(0,2).forEach(c=>{
c.places=c.places.map(a=>({
id:a[0],name:a[1],lat:a[2],lng:a[3],
power:a[4],person:a[5]
}));
});

function fresh(){
return {
chapter:0,day:0,cash:32000,troops:0,food:12,
trust:50,network:3,alert:0,debt:0,
owned:["b2"],friends:["scare"],party:["scare"],
loyalty:{scare:75},selected:null,
pending:[],history:[],wars:0,revolts:0
};
}

let s;
try{s=JSON.parse(localStorage.getItem("BENTEN_WARS_V7"))||fresh()}
catch(e){s=fresh()}
if(!CHAPTERS[s.chapter]||!Array.isArray(s.owned))s=fresh();

let speed=1,map=null,markers=[],modal=false;

function chapter(){return CHAPTERS[s.chapter]}
function place(id){return chapter().places.find(p=>p.id===id)}
function target(){return place(s.selected)}
function owned(p){return s.owned.includes(p.id)}

function save(){
localStorage.setItem("BENTEN_WARS_V7",JSON.stringify(s));
}

function note(t){
s.history.unshift("【"+(s.day+1)+"日目】"+t);
s.history=s.history.slice(0,100);
$("log").textContent=t;
save();
}

function art(k){
const p=CAST[k]||CAST.chief;
const color=p[1];
const dino=k==="dino";
const scare=k==="scare";
const clock=k==="clock";
const yamaya=k==="yamaya";

const face=dino?`
<path d="M43 57 Q36 28 72 25 Q101 24 105 53 L117 65 Q119 81 99 83 L57 83 Q40 78 43 57" fill="#65bd84" stroke="#244c40" stroke-width="3"/>
<path d="M48 30 L56 11 L64 29 M69 25 L78 9 L84 27 M89 31 L99 15 L99 39" fill="#388b5e"/>
<circle cx="88" cy="49" r="5" fill="#192b2c"/>
<circle cx="90" cy="47" r="1.5" fill="white"/>
<path d="M88 73 Q102 83 114 72" fill="none" stroke="#265740" stroke-width="3"/>
<path d="M99 78 l5 7 4-7" fill="#fff3da"/>
` : `
<path d="M45 47 Q45 23 70 23 Q98 23 98 48 L96 74 Q88 91 70 91 Q50 89 45 73Z" fill="#efc49b" stroke="#51413e" stroke-width="3"/>
<path d="M43 45 Q40 20 70 19 Q100 19 101 45 L91 37 L48 40Z" fill="${color}"/>
<ellipse cx="57" cy="55" rx="4" ry="${clock?6:3}" fill="#262d36"/>
<ellipse cx="83" cy="55" rx="4" ry="${yamaya?6:3}" fill="#262d36"/>
<path d="${yamaya?"M62 72 Q70 58 80 72 Q76 88 66 85Z":"M61 74 Q70 81 79 74"}" fill="${yamaya?"#6d2b35":"none"}" stroke="#805044" stroke-width="3"/>
${clock?'<circle cx="70" cy="11" r="11" fill="#f7e2ac" stroke="#566071" stroke-width="2"/><path d="M70 4v7l5 3" stroke="#3d4856" stroke-width="2"/>':""}
${scare?'<path d="M18 34 L70 3 L122 34Z" fill="#d8b977" stroke="#71583d" stroke-width="3"/><path d="M37 39H106" stroke="#71583d" stroke-width="6"/>':""}
`;

return `<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p[0]}">
<rect width="140" height="140" rx="18" fill="#263f57"/>
<circle cx="110" cy="27" r="26" fill="#ffffff" opacity=".08"/>
<path d="M12 140 Q13 99 52 91 L88 91 Q127 99 129 140Z" fill="${color}" stroke="#20323d" stroke-width="4"/>
<path d="M57 94 L70 122 L83 94" fill="#f5dfb0"/>
${face}
<path d="M24 132 Q70 115 116 132" stroke="#f3d38b" stroke-width="3" fill="none" opacity=".6"/>
</svg>`;
}

function render(){
$("cash").textContent=fmt(s.cash);
$("troops").textContent=fmt(s.troops);
$("food").textContent=s.food;
$("trust").textContent=s.trust;
$("network").textContent=s.network;
$("alert").textContent=s.alert;
$("debt").textContent=fmt(s.debt);
$("land").textContent=s.owned.length+"/"+chapter().places.length;
$("chapter").textContent=chapter().title;
const d=new Date(2026,0,1+s.day);
$("date").textContent=(Math.floor(s.day/365)+1)+"年目 "+(d.getMonth()+1)+"月"+d.getDate()+"日";
$("mapTitle").textContent=chapter().map;
$("portrait").innerHTML=art("dino");

const p=target();
$("targetName").textContent=p?p.name:"攻略先を選択";
$("targetDesc").textContent=p?CAST[p.person][0]:"地図をタップ";
$("targetPower").textContent=p?(owned(p)?"統治中":"敵戦力 "+p.power):"";

document.querySelectorAll("[data-speed]").forEach(b=>{
b.classList.toggle("active",Number(b.dataset.speed)===speed);
});
markers.forEach(x=>x.marker.setIcon(pinIcon(x.place)));
save();
}

function show(title,text,options=[],person=null){
modal=true;
$("dialogTitle").textContent=title;
$("dialogText").textContent=text;
$("dialogArt").innerHTML=person?art(person):"";
$("choices").replaceChildren();

options.forEach(o=>{
const b=document.createElement("button");
b.className="choice";
const title=document.createElement("b");
title.textContent=o.label;
const sub=document.createElement("small");
sub.textContent=o.note||"";
b.append(title,sub);
b.onclick=()=>{
$("overlay").classList.remove("show");
modal=false;
if(o.fn)o.fn();
render();
};
$("choices").appendChild(b);
});
$("overlay").classList.add("show");
}

function info(title,text,person=null){
show(title,text,[{label:"了解"}],person);
}

function pinIcon(p){
return L.divIcon({
className:"",
html:`<div class="pin ${owned(p)?"owned":""} ${s.selected===p.id?"selected":""}">${owned(p)?"✓":"!"}</div>`,
iconSize:[27,27],iconAnchor:[13,13]
});
}

function drawMap(){
if(!map)return;
markers.forEach(x=>map.removeLayer(x.marker));
markers=[];
map.flyTo(chapter().center,chapter().zoom,{duration:1.2});
chapter().places.forEach(p=>{
const marker=L.marker([p.lat,p.lng],{icon:pinIcon(p)}).addTo(map);
marker.bindTooltip(p.name);
marker.on("click",()=>{
s.selected=p.id;
render();
});
markers.push({place:p,marker});
});
}

function defer(days,type){
s.pending.push({day:s.day+days,type});
}

function advance(days){
for(let i=0;i<days;i++){
s.day++;

if(s.day%7===0){
const expense=2500+s.friends.length*600+Math.ceil(s.troops/10)*300;
const income=1000+s.owned.length*700;
s.cash=Math.max(0,s.cash+income-expense);
s.food=Math.max(0,s.food-1-Math.ceil(s.troops/20));
if(s.debt>0)s.debt=Math.ceil(s.debt*1.005);
}

const event=s.pending.find(e=>e.day<=s.day);
if(event){
s.pending=s.pending.filter(e=>e!==event);
if(event.type==="loan"){
show("借金の催促",
"貸主『そろそろ返済してもらえますか？』",
[
{label:"返済する",note:"現金の範囲で返済",fn:()=>{
const amount=Math.min(s.cash,s.debt);
s.cash-=amount;s.debt-=amount;
if(s.debt>0)defer(14,"loan");
}},
{label:"居留守を使う",note:"信用−12、人脈−4、借金増加",fn:()=>{
s.trust=clamp(s.trust-12,0,100);
s.network=clamp(s.network-4,0,100);
s.debt=Math.ceil(s.debt*1.1);
defer(14,"loan");
}}
],"chief");
return true;
}
if(event.type==="revenge"){
show("裏切り者の逆襲",
"かつての仲間が敵軍に合流した！",
[
{label:"防衛する",note:"戦力−8",fn:()=>{s.troops=Math.max(0,s.troops-8)}},
{label:"放置する",note:"信用−15、反乱の危険",fn:()=>{
s.trust=clamp(s.trust-15,0,100);
revolt();
}}
],"yamaya");
return true;
}
if(event.type==="clock"){
show("いまはなんじ？",
"おじさん『いまはなんじ？』\n秘書官『さっきも聞かれました！』",
[
{label:"正確な時間を教える",note:"人脈＋2",fn:()=>{
s.network=clamp(s.network+2,0,100);
defer(7,"clock");
}},
{label:"適当に答える",note:"時間が3日進む可能性",fn:()=>{
s.day+=3;
defer(7,"clock");
}}
],"clock");
return true;
}
}

if(s.cash===0||s.food===0||s.trust<=10){
crisis();
return true;
}
if(s.alert>=75&&Math.random()<.05){
intervention();
return true;
}
if(s.trust<30&&Math.random()<.04){
revolt();
return true;
}
}
return false;
}

function crisis(){
show("弁天軍、存亡の危機",
"資金・食料・信用のいずれかが限界に達した。\n秘書官『戦争どころではありません！』",
[
{label:"地元から借金",note:"現金＋50,000、食料＋5、借金＋55,000",fn:()=>{
s.cash+=50000;s.food+=5;s.debt+=55000;
s.network=clamp(s.network-3,0,100);
defer(14,"loan");
}},
{label:"給料の支払いを延期",note:"食料＋3、仲間の忠誠−25",fn:()=>{
s.food+=3;s.trust=clamp(s.trust+5,0,100);
s.friends.forEach(k=>s.loyalty[k]=clamp((s.loyalty[k]||60)-25,0,100));
defect();
}},
{label:"私物を売る",note:"現金＋20,000、食料＋3、信用−5",fn:()=>{
s.cash+=20000;s.food+=3;s.trust=clamp(s.trust-5,0,100);
}}
],"dino");
}

function defect(){
const k=s.friends.find(x=>(s.loyalty[x]||60)<=15);
if(!k)return;
s.friends=s.friends.filter(x=>x!==k);
s.party=s.party.filter(x=>x!==k);
defer(12,"revenge");
note(CAST[k][0]+"が離反した！");
}

function revolt(){
const candidates=s.owned.filter(id=>id!==chapter().places[0].id);
if(!candidates.length){
s.trust=clamp(s.trust-8,0,100);
note("住民が抗議を始めた。");
return;
}
const id=candidates[rand(0,candidates.length-1)];
const p=place(id);
s.owned=s.owned.filter(x=>x!==id);
s.revolts++;
show("領土反乱！",
p.name+"の住民『恐竜のために税金を払いたくない！』",
[
{label:"再征服を誓う"},
{label:"謝罪する",note:"現金−10,000、信用＋10",fn:()=>{
s.cash=Math.max(0,s.cash-10000);
s.trust=clamp(s.trust+10,0,100);
}}
],p.person);
}

function intervention(){
show("国家からの警告",
"中央から正式な問い合わせが届いた。\n『あなた方はいったい何をしているのですか？』",
[
{label:"活動を自粛",note:"警戒−20、戦力−10",fn:()=>{
s.alert=clamp(s.alert-20,0,100);
s.troops=Math.max(0,s.troops-10);
}},
{label:"弁天独立宣言",note:"警戒＋15、戦力＋15、信用−15",fn:()=>{
s.alert=clamp(s.alert+15,0,100);
s.troops+=15;s.trust=clamp(s.trust-15,0,100);
}}
],"mayor");
}

function war(){
const p=target();
if(!p){info("攻略先が未選択","地図のマーカーを選んでください。");return}
if(owned(p)){info("統治済み",p.name+"はすでに領土です。");return}

const bonus=s.party.reduce((a,k)=>a+(k==="scare"?10:7),0);
show(p.name+" 攻略作戦",
"敵将："+CAST[p.person][0]+
"\n敵戦力："+p.power+
"\n自軍戦力："+(s.troops+bonus)+
"\n\n秘書官『どんな無茶な作戦で攻めますか？』",
[
{label:"⚔ 正面突破・弁天大暴走",note:"兵力消耗／信用低下",fn:()=>fight(p,"charge")},
{label:"🚜 幻想戦車隊・鋼鉄の突撃",note:"現金−30,000／高勝率／国家警戒急上昇",fn:()=>fight(p,"tank")},
{label:"🌀 集団催眠・全員もう寝ろ",note:"現金−12,000／兵力消耗少／失敗時は大混乱",fn:()=>fight(p,"hypnosis")},
{label:"🌙 夜襲・闇の奇襲",note:"現金−8,000／成功時の損耗が少ない",fn:()=>fight(p,"ambush")},
{label:"🔥 全財産投入・破滅の総力戦",note:"現金80%消費／勝率大幅上昇",fn:()=>fight(p,"allin")},
{label:"🌾 案山子将軍を囮にする",note:"勝率上昇／離反の危険",fn:()=>fight(p,"sacrifice")},
{label:"撤退する"}
],p.person);
}

function fight(p,style){
const bonus=s.party.reduce((a,k)=>a+(k==="scare"?10:7),0);
let chance=45+(s.troops+bonus-p.power)*1.1;
let loss=rand(3,9),cost=0,trustLoss=4,alarm=4;

if(style==="charge"){chance+=5;loss+=rand(4,9);trustLoss=6}
if(style==="tank"){chance+=42;cost=30000;loss+=3;alarm=24;trustLoss=15}
if(style==="hypnosis"){chance+=23;cost=12000;loss=2;alarm=11;trustLoss=9}
if(style==="ambush"){chance+=15;cost=8000;loss=rand(1,6)}
if(style==="allin"){chance+=35;cost=Math.floor(s.cash*.8);loss+=5;alarm=13;trustLoss=12}
if(style==="sacrifice"){chance+=30;loss=rand(1,5);trustLoss=8}

chance=clamp(Math.round(chance),5,97);

if(s.cash<cost){info("軍資金不足","必要資金："+fmt(cost)+"円");return}
if(s.troops<=0){info("戦力ゼロ","まず内政・徴兵で戦力を集めてください。");return}

s.cash-=cost;
s.wars++;
s.alert=clamp(s.alert+alarm,0,100);
s.trust=clamp(s.trust-trustLoss,0,100);

const success=rand(1,100)<=chance;
const casualties=Math.min(s.troops,success?loss:loss+rand(5,12));
s.troops-=casualties;

if(style==="sacrifice"&&s.friends.includes("scare")){
s.loyalty.scare=clamp((s.loyalty.scare||75)-rand(20,45),0,100);
defect();
}

const interrupted=advance(style==="ambush"?2:4);

if(success){
s.owned.push(p.id);
s.network=clamp(s.network+rand(1,4),0,100);
s.cash+=rand(4000,12000);
note(p.name+"を制圧！ 戦力−"+casualties);

if(s.owned.length===chapter().places.length){
if(!interrupted)complete();
else defer(1,"chapter");
}else if(!interrupted){
show("勝利！ "+p.name,
"敵将："+CAST[p.person][0]+
"\n損耗："+casualties+
"\n\n勝利したが、領土の維持費も増加する。",
[
{label:"敵将を仲間に誘う",fn:()=>meet(p.person)},
{label:"戦勝パレード",note:"現金−5,000、信用＋5",fn:()=>{
s.cash=Math.max(0,s.cash-5000);
s.trust=clamp(s.trust+5,0,100);
}}
],p.person);
}
}else{
note(p.name+"攻略失敗。戦力−"+casualties);
if(!interrupted){
show("敗北！",
"敵軍に撃退された。\n秘書官『予算も兵力も失いました！』",
[
{label:"撤退して立て直す"},
{label:"敗北を隠蔽",note:"信用−8、警戒＋5",fn:()=>{
s.trust=clamp(s.trust-8,0,100);
s.alert=clamp(s.alert+5,0,100);
}}
],p.person);
}
}
render();
}

function meet(k){
if(k==="dino")return;
if(s.friends.includes(k)){
info("すでに仲間",CAST[k][0]+"とは知り合いです。",k);
return;
}
show("怪しい人物と遭遇",
CAST[k][0]+"\n\n"+CAST[k][3]+
"\n\n必殺技："+CAST[k][2],
[
{label:"仲間にする",note:"人脈−2、維持費増加",fn:()=>{
if(s.network<2){note("人脈不足で採用できなかった。");return}
s.network-=2;s.friends.push(k);
s.loyalty[k]=rand(50,80);
if(s.party.length<3)s.party.push(k);
note(CAST[k][0]+"が仲間になった！");
if(k==="clock")defer(5,"clock");
}},
{label:"名刺交換だけする",note:"人脈＋1",fn:()=>{
s.network=clamp(s.network+1,0,100);
}},
{label:"断る",note:"何も起こらない……はず",fn:()=>{
if(k==="yamaya")defer(10,"revenge");
}}
],k);
}

function work(){
show("資金・調達","戦争には資金と食料が必要。維持費は7日ごとに発生する。",[
{label:"地元でアルバイト",note:"3日／現金＋12,000／信用＋2",fn:()=>{
s.cash+=12000;s.trust=clamp(s.trust+2,0,100);
note("アルバイトで12,000円稼いだ。");
advance(3);
}},
{label:"食料を調達",note:"現金−8,000／食料＋20",fn:()=>{
if(s.cash<8000){note("現金不足。");return}
s.cash-=8000;s.food+=20;
advance(1);note("食料を確保した。");
}},
{label:"知人から借金",note:"現金＋50,000／借金＋55,000／人脈−3",fn:()=>{
s.cash+=50000;s.debt+=55000;
s.network=clamp(s.network-3,0,100);
defer(14,"loan");
note("14日後に借金の催促が来る。");
}},
{label:"借金を返済",fn:()=>{
const n=Math.min(s.cash,s.debt);
s.cash-=n;s.debt-=n;
note(fmt(n)+"円返済した。");
}},
{label:"閉じる"}
],"chief");
}

function people(){
const keys=["clock","yamaya","chief","bath","train","potato","snow","noodle","flower","fish","cherry"];
show("人脈づくり",
"街には理解不能な人物が大量にいる。\n彼らは意外な戦力になるかもしれない。",
[
{label:"怪しい人物に声をかける",note:"現金−3,000／3日経過",fn:()=>{
if(s.cash<3000){note("資金不足。");return}
s.cash-=3000;
const available=keys.filter(k=>!s.friends.includes(k));
const k=available.length?available[rand(0,available.length-1)]:"clock";
if(!advance(3))meet(k);
}},
{label:"地域活動に参加",note:"2日／人脈＋4／信用＋5",fn:()=>{
s.network=clamp(s.network+4,0,100);
s.trust=clamp(s.trust+5,0,100);
advance(2);note("人脈を広げた。");
}},
{label:"謎の交流会を主催",note:"現金−10,000／人脈＋10／警戒＋5",fn:()=>{
if(s.cash<10000){note("資金不足。");return}
s.cash-=10000;
s.network=clamp(s.network+10,0,100);
s.alert=clamp(s.alert+5,0,100);
advance(3);note("謎の交流会が大盛況。");
}},
{label:"閉じる"}
],"clock");
}

function manage(){
show("内政・徴兵",
"領土が増えると収入も増えるが、軍と仲間の維持費も増える。",
[
{label:"志願兵を集める",note:"現金−15,000／食料−3／戦力＋20",fn:()=>{
if(s.cash<15000||s.food<3){note("資金か食料が不足。");return}
s.cash-=15000;s.food-=3;s.troops+=20;
advance(2);note("戦力を20確保した。");
}},
{label:"住民向け事業",note:"現金−12,000／信用＋15",fn:()=>{
if(s.cash<12000){note("資金不足。");return}
s.cash-=12000;s.trust=clamp(s.trust+15,0,100);
advance(3);note("住民の支持が増えた。");
}},
{label:"強引な徴税",note:"現金＋30,000／信用−20／警戒＋10",fn:()=>{
s.cash+=30000;s.trust=clamp(s.trust-20,0,100);
s.alert=clamp(s.alert+10,0,100);
advance(1);note("住民が怒っている。");
}},
{label:"広報で疑惑を否定",note:"現金−8,000／警戒−12",fn:()=>{
if(s.cash<8000){note("資金不足。");return}
s.cash-=8000;s.alert=clamp(s.alert-12,0,100);
advance(3);note("『ただの町内会です』と説明した。");
}},
{label:"閉じる"}
],"mayor");
}

function complete(){
if(s.chapter===0){
show("第1章 完結！",
"弁天周辺を統一した。\n\n弁天ザウルス『次は上山市だ！』",
[
{label:"第2章・上山市統一編へ",fn:()=>{
s.chapter=1;s.owned=["home"];s.selected=null;
s.cash+=30000;s.food+=15;s.troops+=20;
drawMap();note("上山市統一編が開幕！");
}}
],"dino");
}else if(s.chapter===1){
show("第2章 完結！",
"上山市を統一！\n弁天ザウルスは上山ザウルスへ進化した。",
[
{label:"第3章・山形県統一編へ",fn:()=>{
s.chapter=2;s.owned=["y6"];s.selected=null;
s.cash+=100000;s.food+=50;s.troops+=80;
drawMap();note("山形県35市町村への進軍開始！");
}}
],"dino");
}else{
show("山形県統一！",
"弁天二丁目の恐竜が山形県を統一した！"+
"\n\n戦争："+s.wars+"回"+
"\n反乱："+s.revolts+"回"+
"\n借金："+fmt(s.debt)+"円"+
"\n\n秘書官『天下は取りましたが、決算書をご覧ください。』",
[
{label:"統一後の地図を見る"},
{label:"新しい歴史を始める",fn:()=>{
s=fresh();drawMap();
}}
],"dino");
}
}

function party(){
show("仲間・編成",
"現在の編成："+s.party.map(k=>CAST[k][0]).join("、")+
"\n\n最大3人。忠誠が下がると離反する。",
[
{label:"編成を変更",fn:roster},
{label:"閉じる"}
],"scare");
}

function roster(){
modal=true;
$("dialogTitle").textContent="仲間を編成";
$("dialogText").textContent="人物をタップして編成・解除（最大3人）";
$("dialogArt").innerHTML="";
$("choices").replaceChildren();

const grid=document.createElement("div");
grid.className="roster";

s.friends.forEach(k=>{
const b=document.createElement("button");
b.className=s.party.includes(k)?"on":"";
b.innerHTML=art(k);
const label=document.createElement("div");
label.textContent=CAST[k][0]+" 忠誠"+(s.loyalty[k]||50);
b.appendChild(label);
b.onclick=()=>{
if(s.party.includes(k))s.party=s.party.filter(x=>x!==k);
else if(s.party.length<3)s.party.push(k);
roster();render();
};
grid.appendChild(b);
});
$("choices").appendChild(grid);

const close=document.createElement("button");
close.className="choice";
close.textContent="編成を終える";
close.onclick=()=>{
$("overlay").classList.remove("show");
modal=false;render();
};
$("choices").appendChild(close);
$("overlay").classList.add("show");
}

function menu(){
show("記録・設定",
"ゲームは自動保存されます。\n\n戦争："+s.wars+
"回／反乱："+s.revolts+"回\n\n"+
s.history.slice(0,7).join("\n"),
[
{label:"戦記をすべて見る",fn:()=>info("戦記",s.history.join("\n")||"記録なし")},
{label:"最初からやり直す",fn:()=>{
show("初期化の確認","進行状況をすべて消去します。",[
{label:"初期化する",fn:()=>{s=fresh();drawMap()}},
{label:"キャンセル"}
]);
}},
{label:"閉じる"}
],"dino");
}

$("war").onclick=war;
$("work").onclick=work;
$("people").onclick=people;
$("manage").onclick=manage;
$("party").onclick=party;
$("menu").onclick=menu;

$("skip").onclick=()=>{
const n=speed;
if(!advance(n))note(n+"日間スキップした。");
render();
};

document.querySelectorAll("[data-speed]").forEach(b=>{
b.onclick=()=>{
speed=Number(b.dataset.speed);
render();
};
});

window.addEventListener("load",()=>{
if(typeof L!=="undefined"){
map=L.map("map").setView(chapter().center,chapter().zoom);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19,
attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
drawMap();
}else{
$("mapTitle").textContent="地図の読み込みに失敗";
}
render();
if(!s.history.length){
note("弁天二丁目から天下統一を目指す物語が始まった。");
}
});
</script>
</body>
</html>
